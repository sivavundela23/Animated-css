<html>
  <head>
    <style>
      body{
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bgchange 4s infinite alternate;
            transition: 0.5s;
          }
          @keyframes bgchange{
              0%{ background: lightgreen;}
              25%{background: lightblue;}
              50%{background: lightpink;}
              75%{background: black;}
              100%{background: brown;}
          }
          #sv{
            display: flex;
            flex-direction: column;
            padding: 35px;
            gap: 18px;
            animation: bggrow 2s infinite alternate;
            border: 5px solid white;
            border-radius: 20px;
          }
          @keyframes bggrow{
            from{
              box-shadow: 0 0 10px white;
            }
            to{
              box-shadow: 0 0 35px yellow;
            }
          }
          input{
            padding: 12px;
            width: 220px;
            border: none;
            outline: none;
            border-radius: 10px;
            transition: 0.4s;
          }
          input:focus{
            box-shadow: 0 0 15px cyan;
            transform: scale(1.08);
          }
    </style>
  </head>
  <body>
    <form id="sv">
      <input type="text" placeholder="enter name">
      <input type="tel" placeholder="enter phone number">
      <input type="password" placeholder="enter password">
      <input type="email" placeholder="enter email">
    </form>
  </body>
</html>
